name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: caremi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-tests:
    name: Framework tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    defaults:
      run:
        working-directory: framework

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate framework package
        run: composer validate --strict

      - name: Install framework dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run framework tests
        run: composer test

  framework-quality:
    name: Framework quality gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: framework

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Install framework dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer analyse

      - name: Check coding standards
        run: composer cs:check

      - name: Check automated refactoring
        run: composer refactor:check

      - name: Audit framework dependencies
        run: composer audit

  application-integration:
    name: Application integration on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate application package
        run: composer validate --strict

      - name: Install application dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run application integration tests
        run: composer test

      - name: Audit application dependencies
        run: composer audit
        